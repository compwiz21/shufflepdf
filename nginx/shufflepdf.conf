# /etc/nginx/sites-available/shufflepdf
# Symlink: ln -sf /etc/nginx/sites-available/shufflepdf /etc/nginx/sites-enabled/shufflepdf
# Initial config is HTTP-only. After DNS resolves, run:
#   sudo certbot --nginx -d shufflepdf.com -d www.shufflepdf.com
# certbot will inject the SSL server blocks and redirect HTTP -> HTTPS automatically.

server {
    listen 80;
    listen [::]:80;
    server_name shufflepdf.com www.shufflepdf.com;

    client_max_body_size 100m;

    # gzip is on by default in /etc/nginx/nginx.conf — leaving here for clarity
    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Long-cache built assets (hashed filenames)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # pdf.js worker — cache aggressively
    location = /pdf.worker.min.mjs {
        proxy_pass http://127.0.0.1:3010;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
